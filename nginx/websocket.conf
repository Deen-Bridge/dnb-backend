# =============================================================================
# WebSocket / Socket.io proxy configuration (closes #252)
# -----------------------------------------------------------------------------
# Include this file inside the server {} block of nginx.conf:
#     include /etc/nginx/conf.d/websocket.conf;
#
# Socket.io clients connect to /socket.io/ (WebSocket upgrade, with HTTP
# long-polling as the transport fallback). nginx must speak HTTP/1.1 to the
# upstream and forward the Upgrade / Connection headers so the connection can
# be hijacked into a full-duplex WebSocket tunnel. Without this the upgrade
# is silently dropped and the client falls back to polling.
#
# The $connection_upgrade map used below is defined in the http {} block of
# nginx.conf.
# =============================================================================

location /socket.io/ {
    proxy_pass http://dnb_backend;

    # HTTP/1.1 is required for the Upgrade mechanism
    proxy_http_version 1.1;

    # Forward the WebSocket upgrade headers
    proxy_set_header Upgrade    $http_upgrade;
    proxy_set_header Connection $connection_upgrade;

    # Standard forwarding headers (also set globally, kept here for clarity)
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Long-lived connections: keep idle sockets (and heartbeats) alive.
    # Socket.io pings every 25s by default, so 60s comfortably covers them.
    proxy_read_timeout  60s;
    proxy_send_timeout  60s;
    proxy_connect_timeout 10s;

    # Stream frames in real time - do not buffer
    proxy_buffering off;

    # WebSocket handshakes and long-polling frames are small
    client_max_body_size 16k;
}
