# =============================================================================
# Static asset caching headers (closes #255)
# -----------------------------------------------------------------------------
# Include this file inside the server {} block of nginx.conf:
#     include /etc/nginx/conf.d/caching.conf;
#
# Applies long-lived Cache-Control / Expires policies per asset type:
#   - Fingerprinted (hashed) JS/CSS  -> 1 year, immutable
#   - Regular JS/CSS                 -> 7 days
#   - Images                         -> 30 days
#   - Fonts                          -> 1 year, immutable
#   - HTML                           -> no-store (never cache)
#
# NOTE: the Deen Bridge API is served by Node on :5000; static assets are
# usually served from object storage / a CDN. The location blocks below assume
# files are also available under an nginx root - adjust `root`/`alias` to your
# deployment, or keep only the header logic you need. ETags are enabled so
# clients can revalidate cheaply.
# =============================================================================

# ----------------------------------------------------------------------------
# Fingerprinted assets (e.g. app.8f3a2b1c9d0e4f5a.js) - content-addressed,
# safe to cache for a year and never revalidate.
# NOTE: this regex location MUST stay above the generic css/js location.
# ----------------------------------------------------------------------------
location ~* \.[a-f0-9]{16}\.(?:css|js)$ {
    root /var/www/dnb;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    etag on;
}

# ----------------------------------------------------------------------------
# Regular (non-fingerprinted) JavaScript / CSS - short cache so new deploys
# propagate, long enough that repeat visits hit the cache.
# ----------------------------------------------------------------------------
location ~* \.(?:css|js)$ {
    root /var/www/dnb;
    expires 7d;
    add_header Cache-Control "public, max-age=604800";
    etag on;
}

# ----------------------------------------------------------------------------
# Images
# ----------------------------------------------------------------------------
location ~* \.(?:png|jpe?g|gif|webp|avif|svg|ico)$ {
    root /var/www/dnb;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    etag on;
}

# ----------------------------------------------------------------------------
# Fonts - rarely change, cache aggressively
# ----------------------------------------------------------------------------
location ~* \.(?:woff2?|ttf|otf|eot)$ {
    root /var/www/dnb;
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
    etag on;
}

# ----------------------------------------------------------------------------
# HTML - never cache (always revalidate)
# ----------------------------------------------------------------------------
location ~* \.html?$ {
    root /var/www/dnb;
    expires -1;
    add_header Cache-Control "no-cache, no-store, must-revalidate";
    etag on;
}

# ----------------------------------------------------------------------------
# CDN-style media path (large user uploads proxied/redirected from the API,
# e.g. Cloudinary URLs) - 30 day public cache, no cookie leakage.
# ----------------------------------------------------------------------------
location /media/ {
    proxy_pass http://dnb_backend;
    expires 30d;
    add_header Cache-Control "public, max-age=2592000";
    add_header X-Content-Type-Options nosniff;
}
