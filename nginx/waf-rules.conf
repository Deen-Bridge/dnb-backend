# =============================================================================
# Custom WAF rules for the Deen Bridge backend (closes #256)
# -----------------------------------------------------------------------------
# Defense-in-depth rules on top of the OWASP CRS. Rule IDs use the
# 200000-200099 range to avoid colliding with CRS (900000+) or the
# exclusions file (200100+).
#
# Design notes:
#   * Hard protocol violations (request smuggling, null bytes, invalid JSON,
#     oversized input) are denied immediately.
#   * Suspicious-but-ambiguous traffic (scanner user agents) is scored into
#     the CRS anomaly bucket instead of hard-blocked, so the final decision
#     still comes from the anomaly threshold - keeping "anomaly scoring mode"
#     as the single enforcement point.
# =============================================================================

# -----------------------------------------------------------------------------
# Anomaly scoring fallback (200008)
# -----------------------------------------------------------------------------
# Guarantees anomaly scoring is active even if crs-setup.conf ships with the
# threshold/paranoia blocks commented out. For real tuning edit crs-setup.conf:
# this rule runs after CRS initialization (901xxx), so raising the paranoia
# level here only affects phase:2 rules, not the phase:1 protocol checks.
SecAction "id:200008,phase:1,nolog,pass,t:none,\
setvar:'tx.inbound_anomaly_score_threshold=5',\
setvar:'tx.outbound_anomaly_score_threshold=4',\
setvar:'tx.paranoia_level=1'"

# -----------------------------------------------------------------------------
# Disallowed HTTP methods (200001)
# -----------------------------------------------------------------------------
# TRACE enables XST attacks; CONNECT is only for proxies and is never needed
# by the API. CRS flags these too, but deny at the edge regardless.
SecRule REQUEST_METHOD "@pm TRACE CONNECT" \
    "id:200001,phase:1,deny,status:405,log,\
    msg:'Disallowed HTTP method',\
    tag:'protocol-violation',\
    tag:'attack-generic'"

# -----------------------------------------------------------------------------
# Strict JSON content-type enforcement (200002)
# -----------------------------------------------------------------------------
# API endpoints exchange JSON. If a request claims to be application/json but
# the body does not parse as JSON (starts with { or [ after whitespace), reject
# it. Multipart uploads are exempted in waf-exclusions.conf (rule 200103).
SecRule REQUEST_HEADERS:Content-Type "@rx ^application/json" \
    "id:200002,phase:2,deny,status:400,log,\
    msg:'Request body is not valid JSON',\
    tag:'language-json',\
    tag:'application-multi',\
    t:none,\
    chain"
    SecRule REQUEST_BODY "@rx ^(?!\s*[{[])"

# -----------------------------------------------------------------------------
# Request smuggling indicators (200003)
# -----------------------------------------------------------------------------
# A request that carries BOTH Transfer-Encoding and Content-Length is the
# classic CL.TE/TE.CL smuggling signature - proxies disagree on the body end.
SecRule REQUEST_HEADERS:Transfer-Encoding "@rx ." \
    "id:200003,phase:1,deny,status:400,log,\
    msg:'Request smuggling attempt: Transfer-Encoding with Content-Length',\
    tag:'protocol-violation',\
    tag:'attack-generic',\
    chain"
    SecRule REQUEST_HEADERS:Content-Length "@rx ^\d+$"

# -----------------------------------------------------------------------------
# Null bytes (200004)
# -----------------------------------------------------------------------------
SecRule REQUEST_URI|ARGS "@rx %00" \
    "id:200004,phase:1,deny,status:400,log,\
    msg:'Null byte detected in request',\
    tag:'protocol-violation'"

# -----------------------------------------------------------------------------
# Known attack scanners (200005)
# -----------------------------------------------------------------------------
# Score into the anomaly bucket (+5 = critical, above the default threshold)
# instead of hard-denying, so a false positive never takes the site down.
SecRule REQUEST_HEADERS:User-Agent "@rx (?:sqlmap|nikto|nuclei|masscan|wpscan|nessus|acunetix|openvas|fimap|metasploit|hydra|dirbuster|gobuster|wfuzz|whatweb|jarm|zmap)" \
    "id:200005,phase:1,log,pass,t:none,t:lowercase,\
    setvar:'tx.anomaly_score=+5',\
    msg:'Known attack scanner user-agent',\
    tag:'attack-scanner'"

# -----------------------------------------------------------------------------
# Excessively long URIs (200007)
# -----------------------------------------------------------------------------
# Prevents log flooding and abuse of very long query strings.
SecRule REQUEST_URI "@rx .{4097,}" \
    "id:200007,phase:1,deny,status:414,log,\
    msg:'Request URI too long',\
    tag:'protocol-violation'"
