# =============================================================================
# ModSecurity core configuration for the Deen Bridge backend (nginx)
# (closes #256)
# -----------------------------------------------------------------------------
# This is a ModSecurity rules file - NOT an nginx config. It is loaded by the
# modsecurity-nginx connector from nginx.conf:
#
#     modsecurity on;
#     modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;
#
# It enables the rule engine, configures request body inspection, loads the
# OWASP Core Rule Set (CRS) in anomaly-scoring mode and finally loads our
# custom rules (waf-rules.conf) and false-positive exclusions
# (waf-exclusions.conf) so they can override CRS behaviour.
#
# Install layout (see nginx/README.md for full instructions):
#   /etc/nginx/modsecurity/
#   ├── modsecurity.conf        <- this file
#   ├── waf-rules.conf          <- custom WAF rules
#   ├── waf-exclusions.conf     <- false-positive exclusions
#   └── crs/
#       ├── crs-setup.conf      <- OWASP CRS configuration
#       └── rules/*.conf        <- OWASP CRS rule files (v3.x or v4.x)
# =============================================================================

# -----------------------------------------------------------------------------
# Rule engine
# -----------------------------------------------------------------------------
# Start in blocking mode. For a cautious rollout, switch to DetectionOnly,
# watch the audit log for a week, tune exclusions (waf-exclusions.conf),
# then flip back to On.
SecRuleEngine On

# Request body inspection (required for rules that look at POST bodies)
SecRequestBodyAccess On

# Maximum request body size - must be >= the largest client_max_body_size in
# nginx.conf (50m for /api/uploads) or the WAF would reject big uploads first.
SecRequestBodyLimit 52428800          # 50 MB
SecRequestBodyNoFilesLimit 1048576    # 1 MB for non-file (JSON) bodies
SecRequestBodyInMemoryLimit 1048576   # buffer up to 1 MB in memory, spill to disk
SecRequestBodyLimitAction Reject

# Response body inspection is OFF: the API returns JSON that may legitimately
# contain user content (course text, book excerpts). Rules 950xxx/959xxx that
# need response bodies are skipped, which removes a whole class of false
# positives for an API-first service.
SecResponseBodyAccess Off
SecResponseBodyLimit 1048576
SecResponseBodyMimeType text/plain text/html text/xml

# PCRE limits - guard against ReDoS via expensive rules
SecPcreMatchLimit 100000
SecPcreMatchLimitRecursion 100000

# -----------------------------------------------------------------------------
# Runtime directories (must exist and be writable by the nginx worker)
# -----------------------------------------------------------------------------
SecTmpDir /tmp/
SecDataDir /tmp/

# -----------------------------------------------------------------------------
# Audit log - the primary source for false-positive tuning
# -----------------------------------------------------------------------------
# "RelevantOnly" + 4xx (except 404) / 5xx status keeps the log focused on
# traffic that matters: denied requests and suspicious-but-passed ones.
SecAuditEngine RelevantOnly
SecAuditLogRelevantStatus "^(?:5|4(?!04))"
SecAuditLogParts ABIJDEFHZ
SecAuditLogType Serial
SecAuditLog /var/log/modsec_audit.log

# -----------------------------------------------------------------------------
# Parsing
# -----------------------------------------------------------------------------
SecArgumentSeparator &
SecCookieFormat 0

# CRS v3.x ships unicode.mapping (utils/unicode.mapping in the CRS repo).
# CRS v4.x no longer needs it, so it is commented out - uncomment + copy the
# file if you deploy CRS v3.x:
# SecUnicodeMapFile /etc/nginx/modsecurity/unicode.mapping 20127

SecStatusEngine Off

# -----------------------------------------------------------------------------
# OWASP Core Rule Set (v3.x+)
# -----------------------------------------------------------------------------
# crs-setup.conf holds the CRS tuning knobs: anomaly thresholds, paranoia
# level, allowed HTTP methods/content-types, etc. Copy crs-setup.conf.example
# from the CRS release to this path and review it before going live.
Include /etc/nginx/modsecurity/crs/crs-setup.conf

# The CRS rule files (REQUEST-901-INITIALIZATION.conf ... RESPONSE-999-EXCEPTIONS.conf).
# nginx/ModSecurity does not use the modsecurity.d-style loading - include the
# whole rules/ directory explicitly.
Include /etc/nginx/modsecurity/crs/rules/*.conf

# -----------------------------------------------------------------------------
# Custom rules & false-positive exclusions
# -----------------------------------------------------------------------------
# Loaded LAST so they run after CRS rules and can override them (exclusions
# via ctl:ruleRemoveById must be evaluated after the rules they disable).
Include /etc/nginx/modsecurity/waf-rules.conf
Include /etc/nginx/modsecurity/waf-exclusions.conf
