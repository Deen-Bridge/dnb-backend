# =============================================================================
# False-positive exclusions for the Deen Bridge backend (closes #256)
# -----------------------------------------------------------------------------
# The OWASP CRS is generic and written primarily for traditional web apps, so
# an API-first backend like this one needs targeted exclusions. Each exclusion
# below is scoped as narrowly as possible (specific path AND/OR content-type)
# and documents WHY it exists. Rule IDs use the 200100+ range.
#
# Tuning workflow (also documented in nginx/README.md):
#   1. Run in DetectionOnly mode (SecRuleEngine DetectionOnly) or watch the
#      audit log at /var/log/modsec_audit.log for blocked legit traffic.
#   2. Identify the CRS rule id from the audit log ("Matched rule ...").
#   3. Add a scoped ctl:ruleRemoveById for that id - never globally.
#   4. Verify with the "benign traffic" checks in the README before enabling.
# =============================================================================

# -----------------------------------------------------------------------------
# 1) Health checks (200101)
# -----------------------------------------------------------------------------
# Liveness/readiness probes (k8s, Docker HEALTHCHECK, LB checks) hit /health
# with bare user agents and no auth. Inspecting them adds zero value and
# probes have been known to trip UA/header rules. Skip all CRS + custom rules
# for these endpoints.
SecRule REQUEST_URI "@beginsWith /health" \
    "id:200101,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveById=920000-990000,\
    ctl:ruleRemoveById=200000-200099"

# -----------------------------------------------------------------------------
# 2) WebSocket / Socket.io handshake (200102)
# -----------------------------------------------------------------------------
# Socket.io clients connect to /socket.io/ with an Upgrade request that may
# carry non-standard headers (Sec-WebSocket-*, no content-type, odd
# user-agents from native apps). The CRS protocol-policy family (920xxx)
# frequently false-positives on these. We keep the attack-detection rules
# (930xxx-942xxx) active - the handshake is a GET with no body - and only
# disable the header/content-type policy checks for this path.
SecRule REQUEST_URI "@beginsWith /socket.io/" \
    "id:200102,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveById=920210,ctl:ruleRemoveById=920220,ctl:ruleRemoveById=920230,\
    ctl:ruleRemoveById=920240,ctl:ruleRemoveById=920250,ctl:ruleRemoveById=920260,\
    ctl:ruleRemoveById=920270,ctl:ruleRemoveById=920280,ctl:ruleRemoveById=920290,\
    ctl:ruleRemoveById=920300,ctl:ruleRemoveById=920310,ctl:ruleRemoveById=920320,\
    ctl:ruleRemoveById=920330,ctl:ruleRemoveById=920340,ctl:ruleRemoveById=920350,\
    ctl:ruleRemoveById=920360,ctl:ruleRemoveById=920370,ctl:ruleRemoveById=920380,\
    ctl:ruleRemoveById=920390,ctl:ruleRemoveById=920400,ctl:ruleRemoveById=920410,\
    ctl:ruleRemoveById=920420,ctl:ruleRemoveById=920430,ctl:ruleRemoveById=920440,\
    ctl:ruleRemoveById=920450,ctl:ruleRemoveById=920460,ctl:ruleRemoveById=920470,\
    ctl:ruleRemoveById=920480"

# -----------------------------------------------------------------------------
# 3) Multipart file uploads (200103)
# -----------------------------------------------------------------------------
# /api/uploads uses multipart/form-data (and Cloudinary signed uploads).
# CRS rule 920420 ("Request content type is not allowed by policy") and
# 920410 ("File upload") can flag legitimate multipart uploads depending on
# the crs-setup policy, and our own JSON-body rule (200002) must never apply
# to multipart. Scoped to the upload path + content type only.
SecRule REQUEST_HEADERS:Content-Type "@beginsWith multipart/form-data" \
    "id:200103,phase:1,pass,nolog,t:none,\
    ctl:ruleRemoveById=200002,\
    ctl:ruleRemoveById=920410,\
    ctl:ruleRemoveById=920420"

# -----------------------------------------------------------------------------
# 4) Tuning examples - uncomment only after observing real traffic
# -----------------------------------------------------------------------------
#
# a) Rich text / HTML in JSON (course descriptions, book excerpts, posts).
#    CRS 941xxx (XSS) may flag HTML snippets that are legitimate user content.
#    If course content trips 941100, scope an exclusion to that path:
#
#    SecRule REQUEST_URI "@beginsWith /api/courses" \
#        "id:200104,phase:1,pass,nolog,t:none,\
#        ctl:ruleRemoveById=941100-941199"
#
# b) PHP-specific injection rules (932xxx). This is a Node.js backend, so PHP
#    payloads in request bodies are almost always noise. Keep them ON by
#    default (defense-in-depth); if they start firing on legit traffic, the
#    usual suspects are 932130 / 932131 / 932150. Exclude per-rule, e.g.:
#
#    SecRule REQUEST_URI "@beginsWith /api/" \
#        "id:200105,phase:1,pass,nolog,t:none,\
#        ctl:ruleRemoveById=932130,ctl:ruleRemoveById=932131"
#
# c) SQL-keyword false positives in search/text endpoints (942xxx).
#    Search for "select", "union" etc. in book/course text is legitimate.
#    If that happens, scope 942xxx exclusions to the search route instead of
#    weakening SQLi protection globally:
#
#    SecRule REQUEST_URI "@beginsWith /api/search" \
#        "id:200106,phase:1,pass,nolog,t:none,\
#        ctl:ruleRemoveById=942100-942999"
#
# d) Paranoia level. If the default PL1 is too noisy in production, first try
#    raising thresholds in crs-setup.conf (tx.inbound_anomaly_score_threshold)
#    before disabling rules. Lowering paranoia is a last resort.
