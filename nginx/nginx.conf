# =============================================================================
# Deen Bridge backend - nginx reverse proxy configuration
# -----------------------------------------------------------------------------
# Reverse proxy in front of the Node.js API (default port 5000) providing:
#   - Request body size limits per endpoint            (closes #254)
#   - ModSecurity WAF with OWASP CRS (anomaly scoring) (closes #256)
#   - WebSocket / Socket.io proxy                      (closes #252)
#   - Static asset caching headers                     (closes #255)
#
# Deployment: copy this file (and the sibling snippets in this directory) to
# the nginx host/container, e.g. /etc/nginx/nginx.conf, then run:
#     nginx -t && systemctl reload nginx
# See nginx/README.md for the full setup guide.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

# Load the ModSecurity nginx connector (modsecurity-nginx).
# Uncomment once the module is compiled/installed - see nginx/README.md:
#   load_module modules/ngx_http_modsecurity_module.so;

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Hide nginx version in Server headers / error pages
    server_tokens off;

    # ------------------------------------------------------------------
    # WebSocket connection upgrade mapping
    # Used by websocket.conf: closes #252
    # ------------------------------------------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # ------------------------------------------------------------------
    # Compression for proxied responses
    # ------------------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        text/xml
        application/xml
        application/xml+rss
        image/svg+xml
        application/font-woff2;

    # ------------------------------------------------------------------
    # Upstream application (matches PORT in .env / docker-compose.yml)
    # ------------------------------------------------------------------
    upstream dnb_backend {
        server 127.0.0.1:5000;
        keepalive 32;
    }

    server {
        listen 80;
        server_name _;

        # ==============================================================
        # Request body size limits (closes #254)
        # --------------------------------------------------------------
        # Defaults applied to every request. Larger limits are granted
        # only where the API actually needs them (see locations below).
        # ==============================================================
        client_max_body_size        1m;    # strict default for API endpoints
        client_body_buffer_size     128k;
        client_body_timeout         30s;   # prevent slow-loris body uploads

        # Clear JSON error when a client exceeds a size limit
        error_page 413 /413.json;
        location = /413.json {
            internal;
            default_type application/json;
            return 413 '{"error":"Payload Too Large","message":"Request body exceeds the maximum allowed size for this endpoint"}';
        }

        # ==============================================================
        # ModSecurity WAF with OWASP CRS (closes #256)
        # --------------------------------------------------------------
        # modsecurity_rules_file points at the main ModSecurity config,
        # which enables the rule engine, loads OWASP CRS (anomaly
        # scoring mode) and our custom rules + exclusions.
        # ==============================================================
        modsecurity on;
        modsecurity_rules_file /etc/nginx/modsecurity/modsecurity.conf;

        # Common proxy settings for the API upstream
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection        "";
        proxy_connect_timeout 10s;
        proxy_read_timeout    60s;
        proxy_send_timeout    60s;

        # --------------------------------------------------------------
        # Health checks - minimal body size, no caching
        # --------------------------------------------------------------
        location = /health {
            client_max_body_size 1k;
            proxy_pass http://dnb_backend;
        }
        location /health/ {
            client_max_body_size 1k;
            proxy_pass http://dnb_backend;
        }

        # --------------------------------------------------------------
        # File/media uploads - largest allowed body (Cloudinary signed
        # uploads, media POSTs). Still capped to prevent DoS.
        # --------------------------------------------------------------
        location /api/uploads {
            client_max_body_size 50m;
            client_body_buffer_size 1m;
            proxy_pass http://dnb_backend;
        }

        # --------------------------------------------------------------
        # Generic API - inherits the strict 1m default
        # --------------------------------------------------------------
        location /api/ {
            proxy_pass http://dnb_backend;
        }

        # --------------------------------------------------------------
        # Static asset caching headers (closes #255)
        # --------------------------------------------------------------
        include /etc/nginx/conf.d/caching.conf;

        # --------------------------------------------------------------
        # WebSocket / Socket.io proxy (closes #252)
        # --------------------------------------------------------------
        include /etc/nginx/conf.d/websocket.conf;

        # --------------------------------------------------------------
        # Everything else -> API
        # --------------------------------------------------------------
        location / {
            proxy_pass http://dnb_backend;
        }
    }
}
