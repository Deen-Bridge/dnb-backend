apiVersion: v1
kind: Service
metadata:
  name: dnb-backend
  namespace: default
  labels:
    app: dnb-backend
spec:
  type: ClusterIP
  selector:
    app: dnb-backend
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
      appProtocol: http
  sessionAffinity: ClientIP
