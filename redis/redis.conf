################################################################################
# DEEN BRIDGE BACKEND - REDIS HIGH AVAILABILITY CONFIGURATION
# File: redis/redis.conf
#
# Production-ready Redis server configuration supporting:
#  1. Standalone Primary (Master)
#  2. Standalone Replica (Slave)
#  3. Redis Sentinel High Availability
#  4. Redis Cluster (Distributed Sharding)
################################################################################

################################## NETWORK #####################################

# By default, if no "bind" directive is specified, Redis will listen for
# connections from all the network interfaces available on the server.
bind 0.0.0.0

# Protected mode is a layer of security protection. When enabled, Redis will
# only reply to queries from the loopback interface unless a password is set
# or specific network interfaces are bound.
protected-mode yes

# Accept connections on the specified port, default is 6379.
port 6379

# TCP listen() backlog. In high requests-per-second environments you need an
# elevated backlog in order to avoid slow clients connections issues.
tcp-backlog 511

# Close the connection after a client is idle for N seconds (0 to disable).
timeout 0

# TCP keepalive: Send ACKs to clients periodically to detect dead peers.
tcp-keepalive 300

################################# GENERAL #####################################

# By default Redis does not run as a daemon. Use 'yes' if running as a service.
daemonize no

# If you run Redis from upstart or systemd, Redis can interact with your
# supervision tree. Options: no, upstart, systemd, auto.
supervised no

# If a pid file is specified, Redis writes it where specified at startup.
pidfile /var/run/redis_6379.pid

# Specify the server verbosity level.
# Can be one of: debug, verbose, notice, warning.
loglevel notice

# Specify the log file name. An empty string can be used to force Redis to log
# on the standard output (ideal for Docker / containerized environments).
logfile ""

# Set the number of databases. The default database is DB 0.
# Note: In Redis Cluster mode, only database 0 is supported.
databases 16

# Always show logo at startup
always-show-logo no

# By default Redis shows an ASCII art logo only when started to log to the
# standard output.
set-proc-title yes
proc-title-template "{title} {listen-addr} {server-mode}"

################################ PERSISTENCE ##################################

# Save the DB to disk:
# save <seconds> <changes>
# Will save the DB if both the given number of seconds and the given
# number of write operations against the DB occurred.
save 900 1
save 300 10
save 60 10000

# By default Redis will stop accepting writes if RDB snapshots are enabled
# and the latest background save failed.
stop-writes-on-bgsave-error yes

# Compress string objects using LZF when dump .rdb databases?
rdbcompression yes

# Since version 5 of RDB a CRC64 checksum is placed at the end of the file.
rdbchecksum yes

# The filename where to dump the DB
dbfilename dump.rdb

# The working directory for RDB and AOF persistence files.
dir /data

# ----------------- APPEND ONLY MODE (AOF Persistence) -----------------

# By default Redis asynchronously dumps the dataset on disk. This mode is
# good enough in many applications, but an issue with the Redis process or
# a power outage may result into a few minutes of writes lost.
# AOF provides much higher durability.
appendonly yes

# The name of the append-only file (default: "appendonly.aof")
appendfilename "appendonly.aof"

# The fsync() call tells the Operating System to actually write data on disk.
# Options:
#  no: Don't fsync, just let the OS flush data when it wants. Fast.
#  always: fsync after every write to the append log. Slow, Safest.
#  everysec: fsync only once every second. Compromise (Recommended).
appendfsync everysec

# When the AOF fsync policy is set to always or everysec, and a background
# saving process is performing heavy I/O, Redis may block too long on the fsync.
no-appendfsync-on-rewrite no

# Automatic AOF rewrite triggering rules:
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# An AOF file may be found to be truncated at the end and load anyway.
aof-load-truncated yes

# When rewriting the AOF file, Redis is able to use an RDB preamble in the
# AOF file for faster rewrites and recoveries.
aof-use-rdb-preamble yes

################################# REPLICATION #################################

# Master-Replica replication configuration.
# Use replicaof to make a Redis instance a copy of another Redis server.
#
# Format: replicaof <masterip> <masterport>
# Example (uncomment on replica nodes or supply via CLI / env):
# replicaof 127.0.0.1 6379

# If the master is password protected (using the "requirepass" configuration
# directive), it is possible to tell the replica to authenticate before
# starting the replication synchronization process.
# masterauth your_strong_redis_password_here

# When a replica loses its connection with the master, or when the replication
# is still in progress, the replica can act in two different ways:
# 1) If replica-serve-stale-data is set to 'yes' (the default) the replica will
#    still reply to client requests, possibly with out-of-date data.
# 2) If replica-serve-stale-data is set to 'no', the replica will reply with
#    an error "SYNC with master in progress" to all commands except INFO/SLAVEOF.
replica-serve-stale-data yes

# You can configure a replica instance to accept writes or not.
# Writing against replicas is useful only in special cases. Replicas are read-only
# by default.
replica-read-only yes

# Replication SYNC strategy: disk or socket.
# New replicas and reconnecting replicas that are not able to continue the
# replication process just receiving differences need to do a "full synchronization".
# Diskless sync creates a child process that directly sends the RDB over the socket.
repl-diskless-sync yes

# Delay in seconds to wait for more replicas to arrive before starting transfer.
repl-diskless-sync-delay 5

# Send PINGs to the master at a predefined interval (default: 10s).
repl-ping-replica-period 10

# Replication timeout: must be greater than repl-ping-replica-period.
repl-timeout 60

# Disable TCP_NODELAY on the replica socket after SYNC?
# 'no' reduces latency at the cost of slight bandwidth increase.
repl-disable-tcp-nodelay no

# Set the replication backlog size. The backlog is a buffer that accumulates
# replica data when replicas are disconnected for some time.
repl-backlog-size 64mb

# After a master has no longer connected replicas for some time, the backlog
# will be freed. The following option configures the time in seconds.
repl-backlog-ttl 3600

# The replica priority is an integer number published by Redis in INFO output.
# It is used by Redis Sentinel in order to select a replica to promote into a
# master during a failover. A priority of 0 marks the replica as not able to
# be promoted to master.
replica-priority 100

# It is possible for a master to stop accepting writes if there are less than
# N replicas connected, having a lag less or equal than M seconds.
# (Uncomment in strict consistency environments to prevent split-brain write loss)
# min-replicas-to-write 1
# min-replicas-max-lag 10

################################## SECURITY ###################################

# Require clients to issue AUTH <PASSWORD> before processing any other
# commands.
# requirepass your_strong_redis_password_here

# Renaming or disabling high-risk commands in multi-tenant or exposed setups:
# rename-command FLUSHDB ""
# rename-command FLUSHALL ""
# rename-command CONFIG "CONFIG_ADMIN_SECRET"

############################## MEMORY MANAGEMENT ##############################

# Set a memory usage limit to the specified amount of bytes.
# When the memory limit is reached Redis will try to remove keys according
# to the eviction policy selected (see maxmemory-policy).
maxmemory 512mb

# MAXMEMORY POLICY: how Redis will select what to remove when maxmemory is reached.
# Options:
#  volatile-lru    -> Evict using approximated LRU among keys with an expire set.
#  allkeys-lru     -> Evict any key using approximated LRU (Recommended for caching).
#  volatile-lfu    -> Evict using approximated LFU among keys with an expire set.
#  allkeys-lfu     -> Evict any key using approximated LFU.
#  volatile-random -> Remove a random key among keys with an expire set.
#  allkeys-random  -> Remove a random key, any key.
#  volatile-ttl    -> Remove the key with the nearest expire time (minor TTL).
#  noeviction      -> Don't expire, just return an error on write operations.
maxmemory-policy allkeys-lru

# LRU, LFU and minimal TTL algorithms are not precise algorithms but approximated
# algorithms (in order to save memory). You can tune it for speed or accuracy.
maxmemory-samples 5

# Replicas ignore maxmemory by default so that they remain identical copies.
replica-ignore-maxmemory yes

############################# LAZY FREEING ####################################

# Redis has two primitives to delete keys: synchronous (DEL) and non-blocking (UNLINK).
# Lazy freeing uses background threads to reclaim memory without blocking the event loop.
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes

################################ REDIS CLUSTER ################################

# Normal Redis instances can't be part of a Redis Cluster; to enable Cluster
# support, uncomment the cluster-enabled directive.
#
# cluster-enabled yes

# Every cluster node has a cluster configuration file. This file is not intended
# to be edited by hand. It is created and updated by Redis nodes.
# cluster-config-file nodes-6379.conf

# Cluster node timeout is the amount of milliseconds a node must be unreachable
# for it to be considered in failure state.
# cluster-node-timeout 5000

# A replica will avoid starting a failover if its data looks too old compared
# to the master.
# cluster-replica-validity-factor 10

# Cluster replicas are able to migrate to orphaned masters.
# cluster-migration-barrier 1

# By default Redis Cluster nodes stop serving queries if they detect there is
# at least an uncovered hash slot. If set to 'no', nodes will serve queries for
# available slots even during partial partitions.
# cluster-require-full-coverage yes

# This option, when set to yes, allows replicas to serve read requests when
# the cluster is partially down.
# cluster-allow-reads-when-down no

############################## ADVANCED CONFIG ################################

# Hashes are encoded using a memory efficient data structure when they have a
# small number of entries.
hash-max-ziplist-entries 512
hash-max-ziplist-value 64

# Lists are encoded in a special way to save a lot of space.
list-max-ziplist-size -2

# Sets have a special encoding when sets happen to be composed of just integers.
set-max-intset-entries 512

# Sorted sets are also specially encoded to save a lot of space.
zset-max-ziplist-entries 128
zset-max-ziplist-value 64

# HyperLogLog sparse representation bytes limit.
hll-sparse-max-bytes 3000

# Active rehashing uses 1 millisecond every 100 milliseconds of CPU time in
# order to help rehashing the main Redis hash table.
activerehashing yes

# Client output buffer limits to protect memory from rogue slow consumers.
client-output-buffer-limit normal 0 0 0
client-output-buffer-limit replica 256mb 64mb 60
client-output-buffer-limit pubsub 32mb 8mb 60

# Redis frequency of internal tasks execution (default: 10, range 1 to 500).
hz 10

# Dynamic HZ enables Redis to dynamically scale HZ based on client count.
dynamic-hz yes

# Enable AOF fsync on rewrite
aof-rewrite-incremental-fsync yes
rdb-save-incremental-fsync yes
