################################################################################
# DEEN BRIDGE BACKEND - REDIS SENTINEL CONFIGURATION
# File: redis/sentinel.conf
#
# Production-ready Redis Sentinel configuration for High Availability monitoring,
# health checks, and automated master failover.
################################################################################

################################## NETWORK #####################################

# Port that this sentinel instance will run on (default: 26379)
port 26379

# Bind to all network interfaces (or specify a specific IP)
bind 0.0.0.0

# Protected mode: When yes, Sentinel will only accept connections from clients
# on loopback interface unless requirepass or specific bind IPs are used.
protected-mode no

# Run as daemon (set to yes when supervised by init/systemd, no for Docker)
daemonize no

# Process ID file location
pidfile /var/run/redis-sentinel.pid

# Log file location ("" writes to stdout)
logfile ""

# Working directory for Sentinel state persistence
dir /tmp

############################# MASTER MONITORING ################################

# Tells Sentinel to monitor this master with the specified name, IP, port,
# and quorum.
#
# Syntax: sentinel monitor <master-group-name> <ip> <port> <quorum>
#
# Quorum is the number of Sentinels that need to agree about the fact the master
# is not reachable, in order for an objective down (ODOWN) to trigger failover.
# In a standard 3-Sentinel deployment, quorum is set to 2.
sentinel monitor mymaster redis-master 6379 2

# Password required to authenticate with the monitored master and its replicas.
# Uncomment if Redis server has 'requirepass' configured.
# sentinel auth-pass mymaster your_strong_redis_password_here

# Time in milliseconds that the master (or any attached replica or sentinel)
# should be unreachable for it to be considered in Subjective Down (SDOWN) state.
# Default: 30000 (30 seconds). Set to 5000 (5 seconds) for faster failover.
sentinel down-after-milliseconds mymaster 5000

# Specifies the failover timeout in milliseconds. It is used in multiple ways:
# 1. The time needed to restart a failover after a previous failover was already
#    attempted on the same master by a given Sentinel.
# 2. The time needed for a replica to replicate data from the new master.
# 3. The time needed for a master to be reconfigured as a replica.
sentinel failover-timeout mymaster 60000

# How many replicas can be reconfigured in parallel to use the new master after
# a failover. Setting this to 1 ensures replicas sync one-by-one, preventing all
# replicas from becoming unavailable simultaneously during full-sync.
sentinel parallel-syncs mymaster 1

############################ HOSTNAME RESOLUTION ###############################

# In containerized, dynamic cloud, or Kubernetes environments, Redis instances
# use hostnames rather than fixed static IPs.
# Enable hostname resolution and announcement:
sentinel resolve-hostnames yes
sentinel announce-hostnames yes

################################## SECURITY ###################################

# Require clients to authenticate with Sentinel before executing commands
# requirepass your_strong_sentinel_password_here

# Password Sentinel uses to authenticate with other Sentinels
# sentinel sentinel-user <username>
# sentinel sentinel-pass <password>

# By default Sentinel will not execute notification and reconfiguration scripts
# when run as root or if denial of script reconfig is enabled.
sentinel deny-scripts-reconfig yes

############################# NOTIFICATION HOOKS ###############################

# Run an external script when an event happens (e.g. sending alert/webhook).
# Arguments passed to script: <event-type> <event-description>
# sentinel notification-script mymaster /var/redis/notify.sh

# Run an external script when master address changes during failover.
# Arguments passed to script: <master-name> <role> <state> <from-ip> <from-port> <to-ip> <to-port>
# sentinel client-reconfig-script mymaster /var/redis/reconfig.sh
