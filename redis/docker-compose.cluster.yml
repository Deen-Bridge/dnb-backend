version: "3.8"

services:
  # ---------------------------------------------------------------------------
  # Redis Cluster Node 1 (Primary)
  # ---------------------------------------------------------------------------
  redis-node-1:
    image: redis:7-alpine
    container_name: redis-cluster-node-1
    command: redis-server --port 7000 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7000:7000"
      - "17000:17000"
    volumes:
      - redis_cluster_node1_data:/data
    networks:
      - redis-cluster-net

  # ---------------------------------------------------------------------------
  # Redis Cluster Node 2 (Primary)
  # ---------------------------------------------------------------------------
  redis-node-2:
    image: redis:7-alpine
    container_name: redis-cluster-node-2
    command: redis-server --port 7001 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7001:7001"
      - "17001:17001"
    volumes:
      - redis_cluster_node2_data:/data
    networks:
      - redis-cluster-net

  # ---------------------------------------------------------------------------
  # Redis Cluster Node 3 (Primary)
  # ---------------------------------------------------------------------------
  redis-node-3:
    image: redis:7-alpine
    container_name: redis-cluster-node-3
    command: redis-server --port 7002 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7002:7002"
      - "17002:17002"
    volumes:
      - redis_cluster_node3_data:/data
    networks:
      - redis-cluster-net

  # ---------------------------------------------------------------------------
  # Redis Cluster Node 4 (Replica)
  # ---------------------------------------------------------------------------
  redis-node-4:
    image: redis:7-alpine
    container_name: redis-cluster-node-4
    command: redis-server --port 7003 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7003:7003"
      - "17003:17003"
    volumes:
      - redis_cluster_node4_data:/data
    networks:
      - redis-cluster-net

  # ---------------------------------------------------------------------------
  # Redis Cluster Node 5 (Replica)
  # ---------------------------------------------------------------------------
  redis-node-5:
    image: redis:7-alpine
    container_name: redis-cluster-node-5
    command: redis-server --port 7004 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7004:7004"
      - "17004:17004"
    volumes:
      - redis_cluster_node5_data:/data
    networks:
      - redis-cluster-net

  # ---------------------------------------------------------------------------
  # Redis Cluster Node 6 (Replica)
  # ---------------------------------------------------------------------------
  redis-node-6:
    image: redis:7-alpine
    container_name: redis-cluster-node-6
    command: redis-server --port 7005 --cluster-enabled yes --cluster-config-file nodes.conf --cluster-node-timeout 5000 --appendonly yes --protected-mode no --bind 0.0.0.0
    ports:
      - "7005:7005"
      - "17005:17005"
    volumes:
      - redis_cluster_node6_data:/data
    networks:
      - redis-cluster-net

  # ---------------------------------------------------------------------------
  # Redis Cluster Initializer (Creates cluster slots & binds replicas)
  # ---------------------------------------------------------------------------
  redis-cluster-init:
    image: redis:7-alpine
    container_name: redis-cluster-init
    depends_on:
      - redis-node-1
      - redis-node-2
      - redis-node-3
      - redis-node-4
      - redis-node-5
      - redis-node-6
    command: >
      sh -c "sleep 3 &&
      echo yes | redis-cli --cluster create
      redis-node-1:7000
      redis-node-2:7001
      redis-node-3:7002
      redis-node-4:7003
      redis-node-5:7004
      redis-node-6:7005
      --cluster-replicas 1"
    networks:
      - redis-cluster-net

volumes:
  redis_cluster_node1_data:
  redis_cluster_node2_data:
  redis_cluster_node3_data:
  redis_cluster_node4_data:
  redis_cluster_node5_data:
  redis_cluster_node6_data:

networks:
  redis-cluster-net:
    driver: bridge
