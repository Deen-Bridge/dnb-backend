name: Mutation Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  mutation:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Stryker packages
        run: npm install --no-save @stryker-mutator/core @stryker-mutator/jest-runner

      - name: Run mutation tests
        run: npx stryker run
        env:
          NODE_OPTIONS: --experimental-vm-modules
          NODE_ENV: test
          PORT: 5000
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          STELLAR_NETWORK: testnet
          CLOUDINARY_CLOUD_NAME: ci_test_cloud
          CLOUDINARY_API_KEY: ci_test_key
          CLOUDINARY_API_SECRET: ci_test_secret_that_should_not_leak

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
