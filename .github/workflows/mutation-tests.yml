name: Mutation Tests

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  mutation:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:6.0
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Stryker packages
        run: npm install --no-save @stryker-mutator/core @stryker-mutator/jest-runner

      - name: Wait for MongoDB
        run: |
          for i in $(seq 1 30);
          do
            if nc -z localhost 27017 2>/dev/null || (exec 6<>/dev/tcp/localhost/27017) 2>/dev/null;
            then
              echo "MongoDB is listening on port 27017"
              break
            fi
            echo "Waiting for MongoDB..."
            sleep 1
          done

      - name: Run mutation tests
        run: npx stryker run
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/deenbridge_mutation
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          STELLAR_NETWORK: testnet
          CLOUDINARY_CLOUD_NAME: ci_test_cloud
          CLOUDINARY_API_KEY: ci_test_key
          CLOUDINARY_API_SECRET: ci_test_secret_that_should_not_leak

      - name: Upload mutation report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutation-report
          path: reports/mutation/
