name: CI

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, dev]

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/deenbridge_test
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          STELLAR_NETWORK: testnet
          CLOUDINARY_CLOUD_NAME: ci_test_cloud
          CLOUDINARY_API_KEY: ci_test_key
          CLOUDINARY_API_SECRET: ci_test_secret_that_should_not_leak

  build:
    name: Syntax and Boot Check
    runs-on: ubuntu-latest

    services:
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017

      redis:
        image: redis:7
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Check syntax of all source files
        run: |
          find . -name "*.js" -not -path "./node_modules/*" -print0 \
            | xargs -0 -n1 node --check

      - name: Start server
        run: node server.js &
        env:
          NODE_ENV: test
          PORT: 5000
          MONGO_URI: mongodb://localhost:27017/deenbridge_boot
          JWT_SECRET: test-secret-key-for-ci-minimum-32-chars
          STELLAR_NETWORK: testnet
          CLOUDINARY_CLOUD_NAME: ci_test_cloud
          CLOUDINARY_API_KEY: ci_test_key
          CLOUDINARY_API_SECRET: ci_test_secret_that_should_not_leak
          REDIS_HOST: localhost
          REDIS_PORT: 6379

      - name: Wait for readiness
        run: |
          for i in {1..30}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/readyz)
            if [ "$STATUS" = "200" ]; then
              echo "Server is ready"
              exit 0
            fi
            echo "Attempt $i: /readyz returned $STATUS, waiting..."
            sleep 2
          done
          echo "Server failed to become ready"
          curl -v http://localhost:5000/readyz
          exit 1

      - name: Assert liveness still works
        run: curl -sf http://localhost:5000/livez
