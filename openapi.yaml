  /api/course-bundles:
    get:
      tags: [Course Bundles]
      operationId: listCourseBundles
      summary: List active course bundles
      description: |
        Paginated and bounded: at most 50 bundles per page. Unknown query parameters are
        rejected. The same router is also mounted at /api/courses/bundles and /api/v1/bundles.
      security: []
      parameters:
        - $ref: "#/components/parameters/BundlePage"
        - $ref: "#/components/parameters/BundleLimit"
        - $ref: "#/components/parameters/BundleSort"
        - name: courseId
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ObjectId" }
        - name: createdBy
          in: query
          required: false
          schema: { $ref: "#/components/schemas/ObjectId" }
        - name: search
          in: query
          required: false
          description: Full-text search over title and description
          schema: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200":
          description: One page of bundles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CourseBundlePage" }
              example:
                success: true
                count: 1
                data:
                  - _id: 6650c2f4e1a2b3c4d5e6f701
                    title: Seerah Essentials
                    description: Two foundational seerah courses
                    courses:
                      - { _id: 6650c2f4e1a2b3c4d5e6f710, title: Seerah I, price: 70 }
                      - { _id: 6650c2f4e1a2b3c4d5e6f711, title: Seerah II, price: 80 }
                    price: 120
                    currency: USDC
                    originalPrice: 150
                    discountPercentage: 20
                    createdBy: { _id: 6650c2f4e1a2b3c4d5e6f799, name: Ustadh Ahmad }
                    isActive: true
                    createdAt: "2026-11-21T10:00:00.000Z"
                    updatedAt: "2026-11-21T10:00:00.000Z"
                pagination: { page: 1, limit: 20, total: 1, pages: 1 }
        "400": { $ref: "#/components/responses/BundleValidationError" }
        "503": { $ref: "#/components/responses/BundleDependencyFailure" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Course Bundles]
      operationId: createCourseBundle
      summary: Create a course bundle
      description: |
        Requires a verified educator or an admin. Non-admins may only bundle courses they
        created. Pricing metadata is computed from the bundled courses.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseBundleCreate" }
            example:
              title: Seerah Essentials
              description: Two foundational seerah courses
              courses: [6650c2f4e1a2b3c4d5e6f710, 6650c2f4e1a2b3c4d5e6f711]
              price: 120
              currency: USDC
      responses:
        "201":
          description: Bundle created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, examples: [true] }
                  data: { $ref: "#/components/schemas/CourseBundle" }
        "400": { $ref: "#/components/responses/BundleValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/BundleForbidden" }
        "409": { $ref: "#/components/responses/BundleConflict" }
        "503": { $ref: "#/components/responses/BundleDependencyFailure" }
        "500": { $ref: "#/components/responses/ServerError" }
