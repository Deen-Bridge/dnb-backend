  /api/search:
    get:
      tags: [Search]
      summary: Search across users, courses, books, spaces and reels
      security: []
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: Search term. The alias query is also accepted.
        - name: query
          in: query
          required: false
          schema: { type: string }
        - name: type
          in: query
          required: false
          schema: { type: string, default: all }
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
