                properties:
                  success: { type: boolean }
                  otp: { type: string }
                  message: { type: string }
        "400":
          description: Missing or non string email, returned without the success field
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }
        "500": { $ref: "#/components/responses/ServerError" }
