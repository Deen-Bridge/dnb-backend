openapi: 3.1.0
info:
  title: DeenBridge Backend API
  version: 1.0.0
  license:
    name: MIT
    url: https://github.com/Deen-Bridge/dnb-backend/blob/main/LICENSE
  description: |
    REST API for DeenBridge: authentication and sessions, courses, the book library,
    community spaces, reels, search, Stellar USDC payments, refunds and disputes,
    educator payouts, media upload signing and the SEP-1 metadata document.

    Provenance of this document:
      - Paths, methods and auth requirements are derived from app.js and src/routes/**,
        which are the authoritative mounting and middleware sources.
      - Component schemas are derived from the Mongoose schemas in src/models/**.
      - Per-endpoint request bodies are described from route middleware and the model
        fields they write. Where a controller accepts more than the model exposes, the
        body is intentionally permissive rather than invented.

    Known response inconsistencies (see issue about response standardization):
      - Most handlers return an envelope of the form { success, message, data }.
      - Some list handlers return a bare array with no envelope.
      - POST /api/email returns { success, otp, message } on success but a bare
        { message } on validation failure.
      - GET /admin/jobs returns HTML when the Accept header prefers HTML, otherwise
        { success, jobs }.
      - GET /metrics returns Prometheus text, and the SEP-1 document returns text/toml.
    Endpoints whose envelope was not verified against the controller are marked with
    x-envelope-unverified so maintainers can confirm them incrementally.
servers:
  - url: https://dnb-backend-api.onrender.com
    description: Production
  - url: http://localhost:5000
    description: Local development
tags:
  - name: Meta
    description: Service banner, health, metrics and SEP-1 metadata
  - name: Auth
    description: Registration, login, password reset and session management
  - name: Users
    description: Profiles, follow graph, recommendations and stats
  - name: Courses
    description: Course CRUD, enrolment, reviews and bookmarks
  - name: Books
    description: Book library, preview streaming, reviews and bookmarks
  - name: Spaces
    description: Live and upcoming spaces, waitlists
  - name: Educators
    description: Content-derived educator directory with contribution counts
  - name: Reels
    description: Short video feed, reactions, comments, shares and views
  - name: Search
    description: Cross-entity search and educator search
  - name: Email
    description: One time password delivery
  - name: Calls
    description: Jitsi meeting tokens
  - name: Wallet
    description: Stellar wallet connection and balances
  - name: Payments
    description: Payment quote, build, submit, history, refunds and disputes
  - name: Donations
    description: Sadaqah donations and aggregate stats
  - name: Payouts
    description: Educator balances, statements and payout batches
  - name: Uploads
    description: Signed Cloudinary upload parameters
  - name: Jobs
    description: Token protected background job dashboard
  - name: Notifications
    description: Real-time and bulk notifications
  - name: Certificates
    description: Verifiable course completion certificates
security:
  - bearerAuth: []
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access token issued by POST /api/auth/login or POST /api/auth/refresh.
    jobsToken:
      type: http
      scheme: bearer
      description: Static token from the JOBS_DASHBOARD_TOKEN environment variable.
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: Unique key for request idempotency protection. Prevents duplicate charges and transactions on retried requests.
      schema:
        type: string
    Page:
      name: page
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      name: limit
      in: query
      required: false
      schema: { type: integer, minimum: 1, default: 10 }
  responses:
    Ok:
      description: Success envelope
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessResponse" }
    Created:
      description: Resource created
      content:
        application/json:
          schema: { $ref: "#/components/schemas/SuccessResponse" }
    BadRequest:
      description: Missing or invalid input
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Missing, malformed or expired credentials
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Authenticated but not permitted for this resource or role
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Resource does not exist, or the feature is disabled by configuration
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflicting state, for example a duplicate or an already used resource
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    UnprocessableEntity:
      description: Request payload mismatch for idempotency key
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    TooManyRequests:
      description: Rate limit exceeded. /api is rate limited globally and /api/auth more strictly.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    ServerError:
      description: Unhandled error, shaped by the central error handler
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    ObjectId:
      type: string
      description: MongoDB ObjectId as a 24 character hex string
      pattern: "^[a-fA-F0-9]{24}$"
    Error:
      type: object
      description: Standard error shape produced by the central error handler
      properties:
        success: { type: boolean, examples: [false] }
        error:
          type: object
          properties:
            code:
              type: string
              description: Machine-readable error code
              enum:
                - VALIDATION_ERROR
                - NOT_FOUND
                - UNAUTHORIZED
                - FORBIDDEN
                - CONFLICT
                - RATE_LIMITED
                - PAYLOAD_TOO_LARGE
                - REQUEST_TIMEOUT
                - NETWORK_UNAVAILABLE
                - PAYMENT_FAILED
                - PAYMENT_REJECTED
                - WALLET_MISMATCH
                - WALLET_NOT_CONNECTED
                - ITEM_NOT_FOUND
                - ALREADY_PURCHASED
                - INSUFFICIENT_BALANCE
                - STALE_XDR
                - INVALID_XDR
                - SPONSORSHIP_REJECTED
                - INTERNAL_ERROR
                - DATABASE_ERROR
                - EXTERNAL_SERVICE_ERROR
            message: { type: string, description: Human-readable error message }
            details:
              type: array
              description: Optional field-level validation errors
              items:
                type: object
                properties:
                  field: { type: string }
                  message: { type: string }
        stack: { type: string, description: Present only in development }
        reqId: { type: string, description: Request correlation ID }
    SuccessResponse:
      type: object
      description: Standard success envelope. Some list handlers return a bare array instead.
      properties:
        success: { type: boolean, examples: [true] }
        message: { type: string }
        data: { description: Payload, shape depends on the endpoint }
    CursorPagination:
      type: object
      description: Cursor-based pagination metadata returned by search endpoints
      properties:
        total:
          type: integer
          description: Total number of matching documents across all pages
        has_more:
          type: boolean
          description: Whether there are more results beyond the current page
        next_cursor:
          type: string
          nullable: true
          description: Opaque cursor to pass as the `cursor` query parameter for the next page. Null when there are no more results.
        page:
          type: integer
          description: Current page number (present only for offset-based fallback)
        limit:
          type: integer
          description: Results per page (present only for offset-based fallback)
        pages:
          type: integer
          description: Total number of pages (present only for offset-based fallback)
    StellarPublicKey:
      type: string
      pattern: "^G[A-Z0-9]{55}$"
      description: Stellar account public key
    Review:
      type: object
      properties:
        user: { $ref: "#/components/schemas/ObjectId" }
        comment: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        createdAt: { type: string, format: date-time }
      required: [user, comment, rating]
    User:
      type: object
      description: Account. The password field is never returned by the API.
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        name: { type: string }
        email: { type: string, format: email }
        avatar: { type: string, format: uri }
        gender: { type: string, enum: [male, female] }
        age: { type: integer, minimum: 2, maximum: 120 }
        country: { type: string }
        language: { type: string }
        interests:
          type: array
          items: { type: string }
        bio: { type: string, maxLength: 500 }
        role: { type: string, enum: [student, tutor, mentor, admin, arbiter], default: student }
        isActive: { type: boolean, default: true }
        lastLogin: { type: string, format: date-time }
        following:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        followers:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        purchasedBooks:
          type: array
          items:
            type: object
            properties:
              bookId: { $ref: "#/components/schemas/ObjectId" }
              purchaseDate: { type: string, format: date-time }
        purchasedCourses:
          type: array
          items:
            type: object
            properties:
              courseId: { $ref: "#/components/schemas/ObjectId" }
              purchaseDate: { type: string, format: date-time }
        bookmarkedBooks:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        bookmarkedCourses:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        stellarWallet:
          type: object
          properties:
            publicKey: { $ref: "#/components/schemas/StellarPublicKey" }
            connectedAt: { type: string, format: date-time }
            network: { type: string, enum: [testnet, mainnet], default: testnet }
        stat:
          type: object
          properties:
            coursesEnrolled: { type: integer, default: 0 }
            booksRead: { type: integer, default: 0 }
            totalUptime: { type: integer, default: 0 }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [name, email]
    Course:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        thumbnail: { type: string, format: uri }
        video: { type: string, description: Video URL or playlist identifier }
        price: { type: number, default: 0, description: Zero means free }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        createdBy: { $ref: "#/components/schemas/ObjectId" }
        enrolledUsers:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [title, description, category, createdBy]
    Book:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        title: { type: string }
        author: { $ref: "#/components/schemas/ObjectId" }
        category: { type: string }
        price: { type: number, default: 0 }
        readCount: { type: integer, default: 0 }
        reviews:
          type: array
          items: { $ref: "#/components/schemas/Review" }
        description: { type: string }
        image: { type: string, format: uri }
        fileUrl: { type: string, format: uri }
        filePublicId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [title, author, description, image, fileUrl]
    Space:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        title: { type: string }
        description: { type: string }
        category: { type: string }
        thumbnail: { type: string, format: uri }
        host: { $ref: "#/components/schemas/ObjectId" }
        price: { type: number, default: 0 }
        status: { type: string, enum: [live, upcoming, ended], default: upcoming }
        eventDate: { type: string, format: date-time }
        eventTime: { type: string, examples: ["14:00"] }
        duration: { type: integer, description: Minutes }
        waitList:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        enrolledUsers:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        meetingRoom: { type: string, description: Generated when absent }
        meetingUrl: { type: string, format: uri, description: Generated from the Jitsi domain }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [title, description, category, host, eventDate, eventTime, duration]
    ReelComment:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        user: { $ref: "#/components/schemas/ObjectId" }
        text: { type: string, maxLength: 500 }
        createdAt: { type: string, format: date-time }
      required: [user, text]
    Reel:
      type: object
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        description: { type: string, maxLength: 2000 }
        category: { type: string }
        tags:
          type: array
          items: { type: string }
        video: { type: string, format: uri }
        videoPublicId: { type: string }
        thumbnail: { type: string, format: uri }
        duration: { type: number }
        createdBy: { $ref: "#/components/schemas/ObjectId" }
        likes:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        loves:
          type: array
          items: { $ref: "#/components/schemas/ObjectId" }
        comments:
          type: array
          items: { $ref: "#/components/schemas/ReelComment" }
        shareCount: { type: integer, default: 0 }
        viewCount: { type: integer, default: 0 }
        likeCount: { type: integer, readOnly: true, description: Virtual }
        loveCount: { type: integer, readOnly: true, description: Virtual }
        commentCount: { type: integer, readOnly: true, description: Virtual }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [description, video, createdBy]
    Transaction:
      type: object
      description: On chain payment or donation record. Amounts are strings to preserve precision.
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        stellarTxHash: { type: string }
        stellarLedger: { type: integer }
        type: { type: string, enum: [purchase, donation], default: purchase }
        buyer: { $ref: "#/components/schemas/ObjectId" }
        buyerWallet: { $ref: "#/components/schemas/StellarPublicKey" }
        creator: { $ref: "#/components/schemas/ObjectId" }
        creatorWallet: { $ref: "#/components/schemas/StellarPublicKey" }
        itemType: { type: string, enum: [book, course], description: Absent for donations }
        itemId: { $ref: "#/components/schemas/ObjectId" }
        itemTypeModel: { type: string, enum: [Book, Course] }
        itemTitle: { type: string }
        amount: { type: string }
        currency: { type: string, enum: [USDC], default: USDC }
        sendAsset:
          type: object
          properties:
            code: { type: string }
            issuer: { type: string }
        sendMax: { type: string }
        network: { type: string, enum: [testnet, mainnet] }
        platformFee:
          type: object
          description: Present only when a fee was applied at build time
          properties:
            feePercent: { type: number }
            platformWallet: { type: string }
            platformAmount: { type: string }
            creatorAmount: { type: string }
        settlement: { type: string, enum: [direct, platform_collect], default: direct }
        status:
          type: string
          enum: [pending, submitted, retrying, confirmed, failed, expired, refunded, disputed]
          default: pending
        refund: { $ref: "#/components/schemas/ObjectId" }
        failureReason: { type: string }
        retryCount: { type: integer, default: 0 }
        submittedAt: { type: string, format: date-time }
        confirmedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: Defaults to thirty minutes after creation }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [stellarTxHash, buyer, buyerWallet, creatorWallet, amount, network]
    Notification:
      type: object
      description: Persisted notification. No HTTP routes are mounted for it in app.js today.
      properties:
        _id: { $ref: "#/components/schemas/ObjectId" }
        recipient: { $ref: "#/components/schemas/ObjectId" }
        sender: { $ref: "#/components/schemas/ObjectId" }
        type:
          type: string
          enum:
            - follow
            - unfollow
            - new_course
            - new_book
            - course_like
            - book_like
            - course_comment
            - book_comment
            - system
            - welcome
            - recommendation
        title: { type: string }
        message: { type: string }
        data:
          type: object
          properties:
            courseId: { $ref: "#/components/schemas/ObjectId" }
            bookId: { $ref: "#/components/schemas/ObjectId" }
            spaceId: { $ref: "#/components/schemas/ObjectId" }
            reelId: { $ref: "#/components/schemas/ObjectId" }
            commentId: { type: string }
        isRead: { type: boolean, default: false }
        isDeleted: { type: boolean, default: false }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
      required: [recipient, sender, type, title, message]
paths:
  /:
    get:
      tags: [Meta]
      summary: Service banner
      security: []
      responses:
        "200":
          description: Service metadata
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  version: { type: string }
                  environment: { type: string }
  /health:
    get:
      tags: [Meta]
      summary: Readiness probe for critical dependencies
      security: []
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [healthy] }
                      timestamp: { type: string, format: date-time }
                      uptime: { type: number }
                      environment: { type: string }
                      dependencies:
                        type: object
                        properties:
                          mongodb:
                            type: object
                            properties:
                              status: { type: string, enum: [up, down] }
                              state: { type: string }
                          redis:
                            type: object
                            properties:
                              status: { type: string, enum: [up, down] }
        "503":
          description: One or more critical dependencies are unavailable
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, examples: [false] }
                  message: { type: string }
                  data:
                    type: object
                    properties:
                      status: { type: string, enum: [unhealthy] }
                      timestamp: { type: string, format: date-time }
                      uptime: { type: number }
                      environment: { type: string }
                      dependencies:
                        type: object
  /ping:
    get:
      tags: [Meta]
      summary: Dependency free liveness probe
      security: []
      responses:
        "200":
          description: The process is alive
          content:
            text/plain:
              schema:
                type: string
                example: pong
  /metrics:
    get:
      tags: [Meta]
      summary: Prometheus metrics
      description: Registered before the rate limiter, so it is never throttled.
      security: []
      responses:
        "200":
          description: Prometheus exposition format
          content:
            text/plain:
              schema: { type: string }
  /.well-known/stellar.toml:
    get:
      tags: [Meta]
      summary: SEP-1 stellar.toml
      description: Served outside the /api rate limiter with permissive CORS, as SEP-1 requires.
      security: []
      responses:
        "200":
          description: TOML document, cacheable for five minutes
          content:
            text/toml:
              schema: { type: string }
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Create an account
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name: { type: string }
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [name, email, password]
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "500": { $ref: "#/components/responses/ServerError" }
      x-envelope-unverified: true
  /api/auth/login:
    post:
      tags: [Auth]
      summary: Exchange credentials for tokens
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
                password: { type: string, format: password }
              required: [email, password]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
      x-envelope-unverified: true
  /api/auth/request-password-reset:
    post:
      tags: [Auth]
      summary: Start a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string, format: email }
              required: [email]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/reset-password:
    post:
      tags: [Auth]
      summary: Complete a password reset
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                token: { type: string }
                password: { type: string, format: password }
              required: [token, password]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate the session and issue a new access token
      description: Guarded by a dedicated refresh rate limiter.
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                refreshToken:
                  type: string
                  description: May instead be supplied by cookie, since cookie-parser is enabled.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
      x-envelope-unverified: true
  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke the current session
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/sessions:
    get:
      tags: [Auth]
      summary: List sessions for the current user
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-envelope-unverified: true
    delete:
      tags: [Auth]
      summary: Revoke every session except the current one
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/auth/sessions/{sessionId}:
    delete:
      tags: [Auth]
      summary: Revoke one session
      parameters:
        - name: sessionId
          in: path
          required: true
          schema: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/users/completion:
    get:
      tags: [Users]
      summary: Get authenticated user's profile completion metrics and suggestions
      description: Returns completion percentage, weighted field breakdown, and prioritized improvement suggestions.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/users/completion/criteria:
    get:
      tags: [Users]
      summary: Get profile completion scoring criteria and levels
      description: Public criteria definitions with field weights and progress tier ranges.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
  /api/users/completion/{id}:
    get:
      tags: [Users]
