        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/stellar/donation/submit:
    post:
      tags: [Donations]
      summary: Submit a signed donation transaction
      description: >
        Submits the donor-signed transaction and verifies it on chain. Supports
        the same optional `requestSponsorship: true` fee-bump flow as the payment
        submit endpoint (see docs/fee-sponsorship.md).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signedXdr: { type: string }
                donationId: { $ref: "#/components/schemas/ObjectId" }
                requestSponsorship:
                  type: boolean
                  description: Opt in to platform-paid network fees (fee-bump). Ignored when sponsorship is disabled.
              required: [signedXdr]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/BadRequest" }
  /api/stellar/pledges:
    get:
      tags: [Pledges]
      operationId: listPledges
      summary: List the caller's pledges
      description: |
        Keyset-paginated, newest first (`createdAt` desc, `_id` desc). At most 50 per page.
        Follow `pageInfo.nextCursor` until `hasMore` is false. See docs/pledges.md.
      parameters:
        - $ref: "#/components/parameters/PledgeLimit"
        - $ref: "#/components/parameters/PledgeCursor"
        - name: status
          in: query
          required: false
          schema: { type: string, enum: [active, paused, cancelled] }
      responses:
        "200":
          description: One page of pledges
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PledgePage" }
              example:
                success: true
                pledges:
                  - _id: 6650c2f4e1a2b3c4d5e6f701
                    publicKey: GBRPYHIL2CI3FNQ4BXLFMNDLFJUNPU2HY3ZMFSHONUCEOASW7QC7OX2H
                    amount: "5"
                    cadence: weekly
                    anchorDay: 5
                    anchorDate: null
                    status: active
                    nextDueAt: "2026-11-27T09:00:00.000Z"
                    consecutivePaid: 4
                    longestStreak: 9
                    totalPaidStroops: "650000000"
                    lastPaidAt: "2026-11-20T09:04:11.000Z"
                    createdAt: "2026-06-01T09:00:00.000Z"
                    updatedAt: "2026-11-20T09:04:11.000Z"
                pageInfo:
                  limit: 20
                  hasMore: true
                  nextCursor: eyJrIjoicGxlZGdlIiwidCI6IjIwMjYtMDYtMDFUMDk6MDA6MDAuMDAwWiIsImlkIjoiNjY1MGMyZjRlMWEyYjNjNGQ1ZTZmNzAxIn0
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
    post:
      tags: [Pledges]
      operationId: createPledge
      summary: Create a recurring pledge
      parameters:
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                publicKey: { $ref: "#/components/schemas/StellarPublicKey" }
                amount: { type: string }
                cadence: { type: string, enum: [daily, weekly, monthly] }
                anchorDay: { type: integer, minimum: 0, maximum: 6 }
                anchorDate: { type: integer, minimum: 1, maximum: 31 }
                startAt: { type: string, format: date-time }
              required: [publicKey, amount, cadence]
      responses:
        "201":
          description: Pledge created
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, examples: [true] }
                  pledge: { $ref: "#/components/schemas/Pledge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/stellar/pledges/stats:
    get:
      tags: [Pledges]
      operationId: getPledgeStats
      summary: Aggregate totals across the caller's pledges
      description: |
        Computed with a single aggregation. Returns totals only; the pledge list is not echoed
        (use GET /api/stellar/pledges). Archived cycle history does not affect these totals.
      responses:
        "200":
          description: Pledge totals
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PledgeStats" }
              example:
                success: true
                totalPaidStroops: "650000000"
                longestStreak: 9
                active: 2
                paused: 1
                cancelled: 0
                total: 3
        "401": { $ref: "#/components/responses/Unauthorized" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/stellar/pledges/{id}/status:
    patch:
      tags: [Pledges]
      operationId: updatePledgeStatus
      summary: Pause, resume or cancel a pledge
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
        - $ref: "#/components/parameters/IdempotencyKeyHeader"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                status: { type: string, enum: [active, paused, cancelled] }
              required: [status]
      responses:
        "200":
          description: Updated pledge
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, examples: [true] }
                  pledge: { $ref: "#/components/schemas/Pledge" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stellar/pledges/{id}/cycles:
    get:
      tags: [Pledges]
      operationId: listPledgeCycles
      summary: List a pledge's cycles with payment status
      description: |
        Keyset-paginated, latest `dueAt` first. At most 50 per page. Each cycle carries a minimal
        payment-status object, never the transaction document. Settled cycles older than
        PLEDGE_CYCLE_RETENTION_DAYS are archived and hidden unless `includeArchived=true`.
      parameters:
        - name: id
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
        - $ref: "#/components/parameters/PledgeLimit"
        - $ref: "#/components/parameters/PledgeCursor"
        - name: includeArchived
          in: query
          required: false
          schema: { type: string, enum: ["true", "false"], default: "false" }
      responses:
        "200":
          description: One page of cycles
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PledgeCyclePage" }
              example:
                success: true
                cycles:
                  - _id: 6650c2f4e1a2b3c4d5e6f7a0
                    pledge: 6650c2f4e1a2b3c4d5e6f701
                    dueAt: "2026-11-20T09:00:00.000Z"
                    windowEndsAt: "2026-11-23T09:00:00.000Z"
                    status: paid
                    archived: false
                    transaction:
                      _id: 6650c2f4e1a2b3c4d5e6f7b3
                      status: confirmed
                      stellarTxHash: 3389e9f0f1a65f19736cacf544c2e825313e8447f569233bb8db39aa607c8889
                      confirmedAt: "2026-11-20T09:04:11.000Z"
                pageInfo: { limit: 20, hasMore: false, nextCursor: null }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/stellar/scholarships/applications/config:
    get:
      tags: [Scholarship Applications]
      summary: Read current scholarship round rules and opening status
      description: Requires a signed-in account. Applications remain closed unless SCHOLARSHIP_APPLICATIONS_OPEN is true and public eligibility and funding/refund terms are configured.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/stellar/scholarships/applications:
    post:
      tags: [Scholarship Applications]
      summary: Submit one private application for the current round
      description: Stores the requested USDC amount, study goal, need statement, and eligibility confirmation. Does not collect wallet secrets or identity documents.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [requestedAmountUsdc, studyGoal, needStatement, eligibilityConfirmed]
              properties:
                requestedAmountUsdc: { type: string, pattern: "^[1-9][0-9]{0,5}(\\.[0-9]{1,2})?$" }
                studyGoal: { type: string, minLength: 50, maxLength: 1600 }
                needStatement: { type: string, minLength: 50, maxLength: 1600 }
                eligibilityConfirmed: { type: boolean, const: true }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stellar/scholarships/applications/me:
    get:
      tags: [Scholarship Applications]
      summary: Read the caller's current-round application
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/stellar/scholarships/applications/review:
    get:
      tags: [Scholarship Applications]
      summary: List private applications in the admin review queue
      description: Admin-only; requires the platform's 2FA-verified session.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/stellar/scholarships/applications/{applicationId}/reviews:
    post:
      tags: [Scholarship Applications]
      summary: Submit one independent scored review
      description: Admin-only; each administrator can score an application once. Scores cover need, study plan, impact, and eligibility fit from 1 to 5.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scores, recommendation, note]
              properties:
                scores:
                  type: object
                  required: [need, studyPlan, impact, eligibility]
                  properties:
                    need: { type: integer, minimum: 1, maximum: 5 }
                    studyPlan: { type: integer, minimum: 1, maximum: 5 }
                    impact: { type: integer, minimum: 1, maximum: 5 }
                    eligibility: { type: integer, minimum: 1, maximum: 5 }
                recommendation: { type: string, enum: [support, do_not_support] }
                note: { type: string, minLength: 20, maxLength: 1200 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stellar/scholarships/applications/{applicationId}/decision:
    post:
      tags: [Scholarship Applications]
      summary: Record the final scholarship panel decision
      description: Admin-only. Requires two independent reviews; selection also requires two supporting votes, a majority, an average score of 3/5, and no other selected applicant in the round.
      parameters:
        - name: applicationId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, reason]
              properties:
                decision: { type: string, enum: [selected, not_selected] }
                reason: { type: string, minLength: 20, maxLength: 1200 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stellar/scholarships/state:
    get:
      tags: [Scholarship Escrow]
      summary: Read the configured scholarship escrow state
      description: Reads the active campaign directly from the configured Soroban network and RPC endpoint. Requires a signed-in user with a saved Stellar wallet.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/milestones/reports:
    get:
      tags: [Scholarship Escrow]
      summary: Read private milestone progress reports
      description: Available only to the current campaign beneficiary or its admin arbiter. Reports and supporting links remain off-chain.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/milestones/{index}/reports:
    post:
      tags: [Scholarship Escrow]
      summary: Submit private progress for a milestone
      description: Only the on-chain beneficiary can submit. A report must be approved by the arbiter before a Stellar release transaction can be prepared.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 99 }
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [summary]
              properties:
                summary: { type: string, minLength: 50, maxLength: 2000 }
                evidenceUrl: { type: string, format: uri, pattern: "^https://", maxLength: 2000 }
      responses:
        "201": { $ref: "#/components/responses/Created" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/milestones/{index}/reports/{reportId}/review:
    post:
      tags: [Scholarship Escrow]
      summary: Record arbiter review of a milestone report
      description: Requires an admin 2FA session and the configured on-chain arbiter wallet. Review content is private and off-chain.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 99 }
        - name: reportId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision, note]
              properties:
                decision: { type: string, enum: [approved, rejected] }
                note: { type: string, minLength: 20, maxLength: 1200 }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stellar/scholarships/contributions/initialize:
    post:
      tags: [Scholarship Escrow]
      summary: Prepare a wallet-signed USDC contribution
      description: Builds and simulates an unsigned funding invocation for the configured escrow. The donor's connected wallet must sign it; no secret key is held by this API.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: string, description: Positive USDC amount with up to seven decimal places }
              required: [amount]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/contributions/submit:
    post:
      tags: [Scholarship Escrow]
      summary: Submit a signed scholarship transaction
      description: Checks the signed transaction hash against the prepared contribution before submitting it to Soroban RPC.
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contributionId: { $ref: "#/components/schemas/ObjectId" }
                signedXdr: { type: string, description: Wallet-signed transaction envelope in base64 XDR }
              required: [contributionId, signedXdr]
      responses:
        "202": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/contributions/{contributionId}:
    get:
      tags: [Scholarship Escrow]
      summary: Read the caller's scholarship transaction status
      parameters:
        - name: contributionId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/refunds/initialize:
    post:
      tags: [Scholarship Escrow]
      summary: Prepare the caller's post-expiry refund claim
      parameters:
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/stellar/scholarships/milestones/{index}/release/initialize:
    post:
      tags: [Scholarship Escrow]
      summary: Prepare an arbiter-authorized milestone release
      description: Admin-only. Requires an arbiter-approved private progress report; the stored wallet must also equal the immutable on-chain arbiter address. The arbiter's wallet signs the returned transaction.
      parameters:
        - name: index
          in: path
          required: true
          schema: { type: integer, minimum: 0, maximum: 99 }
        - { $ref: "#/components/parameters/IdempotencyKeyHeader" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reportId]
              properties:
                reportId: { $ref: "#/components/schemas/ObjectId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
  /api/payouts/me/balance:
    get:
      tags: [Payouts]
      summary: Educator balance for the caller
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /api/payouts/me/statement:
    get:
      tags: [Payouts]
      summary: Ledger statement for the caller
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-envelope-unverified: true
  /api/payouts/me/history:
    get:
      tags: [Payouts]
      summary: Past payouts for the caller
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-envelope-unverified: true
  /api/payouts/build:
    post:
      tags: [Payouts]
      summary: Build a payout batch
      description: Operator only. Requires the central payout.initiate capability, an active admin account, and a verified 2FA session.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                minAmount: { type: string }
                educatorIds:
                  type: array
                  items: { $ref: "#/components/schemas/ObjectId" }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/payouts/{batchId}/submit:
    post:
      tags: [Payouts]
      summary: Submit a payout batch
      description: Operator only. Requires the central payout.execute capability, an active admin account, and a verified 2FA session.
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signedXdr: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/uploads/signature:
    post:
      tags: [Uploads]
      summary: Signed Cloudinary upload parameters
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folder: { type: string }
                resourceType: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/jobs:
    get:
      tags: [Jobs]
      summary: Recent background jobs
      description: |
        Guarded by a static bearer token. Returns 404 when JOBS_DASHBOARD_TOKEN is unset,
        so the dashboard is invisible rather than merely locked. Content negotiated: HTML
        when the Accept header prefers HTML, otherwise JSON.
      security:
        - jobsToken: []
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  jobs:
                    type: array
                    items: { type: object }
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/jobs/dead:
    get:
      tags: [Jobs]
      summary: Terminally failed jobs
      security:
        - jobsToken: []
      responses:
        "200":
          description: Dead letter job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  jobs:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
