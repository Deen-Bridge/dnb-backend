          in: query
          required: false
          schema: { type: number }
        - name: maxPrice
          in: query
          required: false
          schema: { type: number }
        - name: free
          in: query
          required: false
          schema: { type: boolean }
        - name: category
          in: query
          required: false
          schema: { type: string }
        - name: minRating
          in: query
          required: false
          schema: { type: number, minimum: 1, maximum: 5 }
        - name: interest
          in: query
          required: false
          schema: { type: string }
        - name: sort
          in: query
          required: false
          schema: { type: string }
        - name: cursor
          in: query
          required: false
          schema: { type: string }
          description: Opaque cursor from a previous response's `pagination.next_cursor` for cursor-based pagination
      responses:
        "200":
          description: Search results with cursor-based pagination
          content:
            application/json:
              schema:
                allOf:
                  - type: object
                    properties:
                      success: { type: boolean, examples: [true] }
                      results:
                        type: object
                        description: Search results keyed by entity type
                      pagination:
                        type: object
                        description: Pagination metadata per entity type
                        additionalProperties:
                          $ref: "#/components/schemas/CursorPagination"
      x-envelope-unverified: true
