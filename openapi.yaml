  /api/stellar/payment/initialize:
    post:
      tags: [Payments]
      summary: Build an unsigned payment transaction
      description: Non custodial flow. The API returns an XDR for the buyer wallet to sign.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                itemType: { type: string, enum: [book, course] }
                itemId: { $ref: "#/components/schemas/ObjectId" }
                buyerWallet: { $ref: "#/components/schemas/StellarPublicKey" }
              required: [itemType, itemId]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stellar/payment/submit:
    post:
      tags: [Payments]
      summary: Submit a signed transaction and verify it on chain
      description: >
        Submits the buyer-signed transaction and verifies it on chain. When
        `requestSponsorship: true` and fee sponsorship is enabled, the platform
        pays the network fee via a fee-bump wrapper (see docs/fee-sponsorship.md).
        Sponsorship-specific failures return a distinct non-fatal 4xx/503 with
        `retryUnsponsored: true` and never mark the transaction failed.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                signedXdr: { type: string }
                transactionId: { $ref: "#/components/schemas/ObjectId" }
                requestSponsorship:
                  type: boolean
                  description: Opt in to platform-paid network fees (fee-bump). Ignored when sponsorship is disabled.
              required: [signedXdr]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/BadRequest" }
        "429": { $ref: "#/components/responses/BadRequest" }
  /api/stellar/payment/transactions:
    get:
      tags: [Payments]
      summary: Transaction history for the caller
      parameters:
        - { $ref: "#/components/parameters/Page" }
        - { $ref: "#/components/parameters/Limit" }
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [pending, submitted, retrying, confirmed, failed, expired, refunded, disputed]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
      x-envelope-unverified: true
