        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /api/payouts/{batchId}/submit:
    post:
      tags: [Payouts]
      summary: Submit a payout batch
      description: Operator only. Gated by the PAYOUT_ADMIN_USER_IDS allowlist inside the controller.
      parameters:
        - name: batchId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                signedXdr: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/uploads/signature:
    post:
      tags: [Uploads]
      summary: Signed Cloudinary upload parameters
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                folder: { type: string }
                resourceType: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /admin/jobs:
    get:
      tags: [Jobs]
      summary: Recent background jobs
      description: |
        Guarded by a static bearer token. Returns 404 when JOBS_DASHBOARD_TOKEN is unset,
        so the dashboard is invisible rather than merely locked. Content negotiated: HTML
        when the Accept header prefers HTML, otherwise JSON.
      security:
        - jobsToken: []
      responses:
        "200":
          description: Job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  jobs:
                    type: array
                    items: { type: object }
            text/html:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
  /admin/jobs/dead:
    get:
      tags: [Jobs]
      summary: Terminally failed jobs
      security:
        - jobsToken: []
      responses:
        "200":
          description: Dead letter job list
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  jobs:
                    type: array
                    items: { type: object }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
