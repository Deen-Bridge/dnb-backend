    post:
      tags: [Payments]
      summary: Escalate a refund to a dispute
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
  /api/stellar/payment/refunds/{refundId}/arbitrate:
    patch:
      tags: [Payments]
      summary: Arbitrate a dispute
      description: Restricted to the admin and arbiter roles.
      parameters:
        - name: refundId
          in: path
          required: true
          schema: { $ref: "#/components/schemas/ObjectId" }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                decision: { type: string }
                notes: { type: string }
              required: [decision]
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /api/stellar/payment/reconciliation/status:
    get:
      tags: [Payments]
      summary: Payment ingestion and reconciliation health (v1)
      description: >
        Admin only (role `admin` with TOTP 2FA enabled). Returns a versioned
        health DTO: an overall `state` (`healthy`, `degraded`, `stalled`) with
        machine-readable `reasons`, per-account cursor freshness and worker
        lease state, the open unreconciled backlog by age, and recent
        arrival/resolution/confirmation rates. Wallet addresses and transaction
        hashes are truncated; memos, amounts and sender accounts are never
        returned, and the backlog sample holds at most five rows. A 200 is
        returned whatever the state; a 503 means the status itself is unknown.
        Thresholds and runbook: docs/payment-reconciliation.md.
      responses:
        "200":
          description: Reconciliation health snapshot
          headers:
            Cache-Control:
              schema: { type: string, enum: [no-store] }
          content:
            application/json:
              schema:
                type: object
                required: [success, reconciliation]
                properties:
                  success: { type: boolean, enum: [true] }
                  reconciliation: { $ref: "#/components/schemas/ReconciliationStatusV1" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: The status could not be computed (treat as unknown)
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Error" }
  /api/stellar/payment/sponsorship/status:
    get:
      tags: [Payments]
      summary: Fee-bump sponsorship status (admin)
      description: >
        Admin-only. Returns whether fee sponsorship is enabled, the sponsor
        account public key (never the secret) and live XLM float, the configured
        caps, and today's spend. See docs/fee-sponsorship.md.
      responses:
        "200": { $ref: "#/components/responses/Ok" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
