  /api/course-bundles/{id}:
    get:
      tags: [Course Bundles]
      operationId: getCourseBundle
      summary: Get a course bundle
      security: []
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, examples: [true] }
                  data: { $ref: "#/components/schemas/CourseBundle" }
        "400": { $ref: "#/components/responses/BundleValidationError" }
        "404": { $ref: "#/components/responses/BundleNotFound" }
        "503": { $ref: "#/components/responses/BundleDependencyFailure" }
        "500": { $ref: "#/components/responses/ServerError" }
    put:
      tags: [Course Bundles]
      operationId: updateCourseBundle
      summary: Update a course bundle
      description: |
        Owner or admin only. Only title, description, courses, price and currency can change;
        ownership and pricing metadata are server-owned. Deactivated bundles return 409.
      parameters:
        - $ref: "#/components/parameters/BundleId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CourseBundleUpdate" }
            example: { price: 99.5 }
      responses:
        "200":
          description: Updated bundle
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean, examples: [true] }
                  data: { $ref: "#/components/schemas/CourseBundle" }
        "400": { $ref: "#/components/responses/BundleValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/BundleForbidden" }
        "404": { $ref: "#/components/responses/BundleNotFound" }
        "409": { $ref: "#/components/responses/BundleConflict" }
        "503": { $ref: "#/components/responses/BundleDependencyFailure" }
        "500": { $ref: "#/components/responses/ServerError" }
    delete:
      tags: [Course Bundles]
      operationId: deleteCourseBundle
      summary: Deactivate a course bundle
      description: Owner or admin only. Soft delete; repeating the call returns 200.
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Bundle deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
              example: { success: true, message: Bundle deactivated successfully }
        "400": { $ref: "#/components/responses/BundleValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/BundleForbidden" }
        "404": { $ref: "#/components/responses/BundleNotFound" }
        "409": { $ref: "#/components/responses/BundleConflict" }
        "503": { $ref: "#/components/responses/BundleDependencyFailure" }
        "500": { $ref: "#/components/responses/ServerError" }
  /api/course-bundles/{id}/purchase:
    post:
      tags: [Course Bundles]
      operationId: purchaseCourseBundle
      summary: Enrol the caller in every course of a bundle
      description: |
        Runs in a single MongoDB transaction and is idempotent: repeating the call enrols
        nothing new and reports `newlyEnrolledCount: 0`. The request takes no body.
      parameters:
        - $ref: "#/components/parameters/BundleId"
      responses:
        "200":
          description: Enrolment result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success: { type: boolean }
                  message: { type: string }
                  bundle: { $ref: "#/components/schemas/CourseBundle" }
                  newlyEnrolledCount: { type: integer, minimum: 0 }
        "400": { $ref: "#/components/responses/BundleValidationError" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "404": { $ref: "#/components/responses/BundleNotFound" }
        "409": { $ref: "#/components/responses/BundleConflict" }
        "503": { $ref: "#/components/responses/BundleDependencyFailure" }
        "500": { $ref: "#/components/responses/ServerError" }
