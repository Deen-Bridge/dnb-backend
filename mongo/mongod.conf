# MongoDB Configuration File for Replica Set Deployment (rs0)
# Reference: https://www.mongodb.com/docs/manual/reference/configuration-options/

# Network interfaces
net:
  port: 27017
  bindIp: 0.0.0.0
  maxIncomingConnections: 10000
  wireObjectCheck: true

# Process management
processManagement:
  timeZoneInfo: /usr/share/zoneinfo

# Logging
systemLog:
  destination: file
  path: /var/log/mongodb/mongod.log
  logAppend: true
  logRotate: reopen
  verbosity: 0

# Storage engine settings
storage:
  dbPath: /data/db
  journal:
    enabled: true
  wiredTiger:
    engineConfig:
      cacheSizeGB: 1
      journalCompressor: snappy
      directoryForIndexes: false
    collectionConfig:
      blockCompressor: snappy
    indexConfig:
      prefixCompression: true

# Replication settings
replication:
  replSetName: "rs0"
  oplogSizeMB: 2048
  enableMajorityReadConcern: true

# Operation profiling for slow queries (>100ms)
operationProfiling:
  mode: slowOp
  slowOpThresholdMs: 100

# Security and access control (uncomment when keyfile authentication is active)
# security:
#   authorization: enabled
#   keyFile: /etc/mongo/keyfile
